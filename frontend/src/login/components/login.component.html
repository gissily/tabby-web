@if (ready()) {
    <div class="login-view">
        @if (providers.length) {
            <div class="buttons">
                @for (provider of providers; track provider.id) {
                    <a [class]="provider.cls" [href]="commonService.backendURL + '/api/1/auth/social/login/' + provider.id + '/'" class="btn">
                        <fa-icon [icon]="provider.faIcon" [fixedWidth]="true"></fa-icon>
                        <span>Log in with {{provider.name}}</span>
                    </a>
                }
            </div>
        } @else {
            <div class="no-providers">
                <p>No authentication providers configured.</p>
                <p class="text-muted">Contact your administrator.</p>
            </div>
        }
    </div>
}
